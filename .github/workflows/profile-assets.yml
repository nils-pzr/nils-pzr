name: Profile assets

# Renders the contribution snake and the stats card into the `output` branch,
# where the README embeds them from raw.githubusercontent.com.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_stats.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nils-pzr
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7e22ce&color_dots=#ebedf0,#f5d0fe,#e879f9,#c026d3,#7e22ce
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#fafafa&color_dots=#161b22,#3b0764,#7e22ce,#c026d3,#e879f9

      - name: Build stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py --login nils-pzr --out dist --token "$GITHUB_TOKEN"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
